packages:
  - apps/*
  - packages/*

catalog:
  '@anthropic-ai/claude-agent-sdk': ^0.3.282
  '@anthropic-ai/sdk': ^0.128.0
  '@hono/node-server': ^2.1.1
  '@nuxt/eslint-config': ^1.17.0
  '@pinia/nuxt': ^1.0.2
  '@types/node': ^24.0.0
  c12: ^3.0.0
  citty: ^0.2.2
  consola: ^3.4.2
  defu: ^6.1.7
  eslint: ^10.11.0
  execa: ^10.0.1
  fast-check: ^4.10.2
  hono: ^4.13.9
  nuxt: ^4.5.2
  p-queue: ^9.3.3
  pathe: ^2.0.3
  pinia: ^4.0.3
  pixelmatch: ^7.2.0
  playwright: ^1.63.0
  pngjs: ^7.0.0
  prettier: ^3.9.9
  tree-sitter-wasm: ^2.0.2
  tsup: ^8.5.1
  tsx: ^4.23.15
  turbo: ^2.11.4
  typescript: ^5.9.3
  ulid: ^3.0.2
  vitest: ^5.0.2
  vue: ^3.5.43
  vue-tsc: ^3.3.11
  web-tree-sitter: ^0.27.0
  zod: ^4.6.5

# pnpm 12 blocks dependency build scripts unless allowed here
allowBuilds:
  esbuild: true
  unrs-resolver: true

# pnpm 12 supply-chain policy: these were newer than the minimum release age at install time
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - turbo@2.11.4
  - vitest@5.0.2
