plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.multiplat.fixtures.notes'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.multiplat.fixtures.notes'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX pulls kotlin-stdlib 1.8 and the old jdk7/jdk8 stdlib artifacts; the BOM lines them up.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    // The JVM stub of org.json in android.jar throws; the real library backs the unit tests.
    testImplementation 'org.json:json:20250517'
}
